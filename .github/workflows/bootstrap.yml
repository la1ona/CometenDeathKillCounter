name: Bootstrap project files

on:
  push:
    paths:
      - .upload/manifest.json

permissions:
  contents: write

jobs:
  build-project-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source and release package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import zipfile

          upload = Path('.upload')

          def restore(prefix: str, destination: str) -> None:
              parts = sorted(upload.glob(prefix + '.part*'))
              if not parts:
                  raise RuntimeError(f'No upload parts found for {prefix}')
              encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
              content = gzip.decompress(base64.b64decode(encoded))
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              print(f'Restored {destination}: {len(content)} bytes')

          restore('source.gz.b64', 'src/CometenDeathCounter.cs')
          restore('panel.gz.b64', 'web/death_counter_panel.html')
          restore('overlay.gz.b64', 'overlay/death_counter_overlay.html')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace(
              'Released under the [MIT License](LICENSE).',
              'Released under the [GNU General Public License v3.0](LICENSE).'
          )
          readme.write_text(readme_text, encoding='utf-8')

          release_dir = Path('release')
          release_dir.mkdir(parents=True, exist_ok=True)
          release_zip = release_dir / 'CometenDeathKillCounter-v1.11.0.zip'
          package_root = 'CometenDeathKillCounter-v1.11.0'

          package_files = [
              ('src/CometenDeathCounter.cs', 'CometenDeathCounter.cs'),
              ('web/death_counter_panel.html', 'death_counter_panel.html'),
              ('overlay/death_counter_overlay.html', 'death_counter_overlay.html'),
              ('docs/INSTALLATION.md', 'INSTALLATION.md'),
              ('LICENSE', 'LICENSE'),
          ]

          with zipfile.ZipFile(release_zip, 'w', zipfile.ZIP_DEFLATED) as archive:
              for source, name in package_files:
                  archive.write(source, f'{package_root}/{name}')

          print(f'Created {release_zip}: {release_zip.stat().st_size} bytes')
          PY

      - name: Commit generated project files
        shell: bash
        run: |
          rm -rf .upload
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add CometenDeathKillCounter v1.11.0 source and package"
          git push
